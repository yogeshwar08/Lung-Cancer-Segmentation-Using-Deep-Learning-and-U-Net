<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lung Cancer Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f1d32;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 35px auto;
            text-align: center;
        }

        .upload-box {
            border: 2px dashed #2374ff;
            border-radius: 20px;
            padding: 55px 45px;
            background: #13233b;
        }

        .upload-icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9ca8b8;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .file-box {
            display: flex;
            align-items: center;
            background: #142238;
            border: 1px solid #34445c;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 30px;
        }

        input[type="file"] {
            width: 100%;
            color: white;
        }

        .preview-container {
            display: none;
            margin: 20px auto 35px;
        }

        .preview-container img {
            max-width: 370px;
            max-height: 320px;
            border-radius: 8px;
            border: 3px solid white;
            object-fit: contain;
        }

        .predict-button {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #246bff, #12c8e9);
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .predict-button:hover {
            opacity: 0.9;
        }

        .predict-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading section */
        .loading-container {
            display: none;
            margin-top: 25px;
            padding: 25px;
            border-radius: 12px;
            background: #102b4a;
            border: 1px solid #2374ff;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 5px solid #34445c;
            border-top: 5px solid #12c8e9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .loading-text {
            color: #9ca8b8;
            font-size: 15px;
            line-height: 1.5;
        }

        .warning {
            color: #ffd166;
            font-size: 14px;
            margin-top: 10px;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #8fa5c2;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="upload-box">

        <div class="upload-icon">☁️</div>

        <h1>Upload CT Scan</h1>

        <div class="subtitle">
            Supported format: JPG / JPEG
        </div>

        <form
            id="predictionForm"
            action="/predict"
            method="POST"
            enctype="multipart/form-data"
        >

            <div class="file-box">

                <input
                    type="file"
                    id="image"
                    name="image"
                    accept=".jpg,.jpeg,image/jpeg"
                    required
                    onchange="previewImage(event)"
                >

            </div>

            <!-- Image Preview -->

            <div
                class="preview-container"
                id="previewContainer"
            >

                <img
                    id="preview"
                    src=""
                    alt="CT Scan Preview"
                >

            </div>

            <!-- Predict Button -->

            <button
                type="submit"
                class="predict-button"
                id="predictButton"
                disabled
            >
                🔬 Analyze CT Scan
            </button>

        </form>

        <!-- Loading -->

        <div
            class="loading-container"
            id="loadingContainer"
        >

            <div class="spinner"></div>

            <div class="loading-title">
                🔄 Analyzing CT Scan...
            </div>

            <div class="loading-text">
                Please wait while the AI model processes your image.
                <br>
                Lung segmentation and classification are in progress.
            </div>

            <div class="warning">
                ⏳ This may take 1–3 minutes on the deployed server.
                Please do not refresh the page.
            </div>

        </div>

    </div>

    <a
        href="/"
        class="back"
        id="backLink"
    >
        ← Back to Home
    </a>

</div>


<script>

function previewImage(event) {

    const file = event.target.files[0];

    const preview =
        document.getElementById("preview");

    const previewContainer =
        document.getElementById("previewContainer");

    const predictButton =
        document.getElementById("predictButton");


    if (!file) {

        previewContainer.style.display = "none";

        predictButton.disabled = true;

        return;
    }


    // Check file type

    const allowedTypes = [
        "image/jpeg"
    ];


    if (!allowedTypes.includes(file.type)) {

        alert("Please upload a JPG or JPEG image.");

        event.target.value = "";

        previewContainer.style.display = "none";

        predictButton.disabled = true;

        return;
    }


    // Check file size
    // 10 MB maximum

    const maxSize = 10 * 1024 * 1024;

    if (file.size > maxSize) {

        alert("Image size must be less than 10 MB.");

        event.target.value = "";

        previewContainer.style.display = "none";

        predictButton.disabled = true;

        return;
    }


    // Create image preview

    const reader = new FileReader();


    reader.onload = function(e) {

        preview.src = e.target.result;

        previewContainer.style.display = "block";

        predictButton.disabled = false;

    };


    reader.readAsDataURL(file);

}


// ============================================================
// SUBMIT FORM
// ============================================================

document
    .getElementById("predictionForm")
    .addEventListener("submit", function() {

        const predictButton =
            document.getElementById("predictButton");

        const loadingContainer =
            document.getElementById("loadingContainer");

        const backLink =
            document.getElementById("backLink");


        // Disable button so user cannot submit twice

        predictButton.disabled = true;

        predictButton.innerHTML =
            "⏳ Processing...";


        // Show loading animation

        loadingContainer.style.display =
            "block";


        // Prevent going back while processing

        backLink.style.pointerEvents =
            "none";

        backLink.style.opacity =
            "0.5";

    });

</script>

</body>

</html>
